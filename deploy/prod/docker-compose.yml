# 国内生产：仅 web + server，MySQL / Redis 使用阿里云托管（见 .env.prod）
# 测试环境仍用 ../docker-compose.yml（含 db、redis）
#
# 使用前：cp .env.example .env.prod，填齐【必填】项
# 启动：docker compose --env-file .env.prod up -d
# 生产镜像：先在 deploy/prod/images 构建 push ACR，再在此填 SERVER_IMAGE / WEB_IMAGE，勿 --build
#
# 同机还需启动 zhiban-agent、voiceprint-api、teaching-stack 的 deploy/prod（共用网络 zhiban-prod）
# HTTPS 由宿主机 edge-nginx（deploy/prod/edge-nginx）占 443，web/server 仅绑定 127.0.0.1，勿对公网暴露 8002/8000

version: '3.8'

services:
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env.prod — build via deploy/prod/images/xiaozhi-web/build-app.sh}
    container_name: xiaozhi-web
    restart: always
    # 密钥等直接从文件进容器，避免 shell 里 export TEACHING_INTERNAL_API_KEY= 空值盖掉 .env.prod
    env_file:
      - .env.prod
    environment:
      TZ: Asia/Shanghai
      XIAOZHI_PARENT_PUBLIC_BASE_URL: ${XIAOZHI_PARENT_PUBLIC_BASE_URL:-}
      SPRING_DATASOURCE_DRUID_URL: >-
        jdbc:mysql://${MYSQL_RDS_HOST}:${MYSQL_RDS_PORT:-3306}/${MYSQL_DATABASE:-xiaozhi_esp32_server}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      SPRING_DATASOURCE_DRUID_USERNAME: ${MYSQL_RDS_USER}
      SPRING_DATASOURCE_DRUID_PASSWORD: ${MYSQL_RDS_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      XIAOZHI_OPENAPI_ENABLED: ${XIAOZHI_OPENAPI_ENABLED:-false}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8002}:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../uploadfile:/uploadfile
    networks:
      prod:
        aliases:
          - manager-api

  server:
    image: ${SERVER_IMAGE:?set SERVER_IMAGE in .env.prod — build via deploy/prod/images/xiaozhi-server/build-app.sh}
    container_name: xiaozhi-server
    restart: always
    depends_on:
      - web
    environment:
      TZ: Asia/Shanghai
    dns:
      - 127.0.0.11
      - 223.5.5.5
      - 100.100.2.136
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_WS_PORT:-8000}:8000"
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_HTTP_PORT:-8003}:8003"
    security_opt:
      - seccomp:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/opt/xiaozhi-esp32-server/data
      - ../models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
    networks:
      - prod

networks:
  prod:
    name: zhiban-prod
    driver: bridge
