# 教研平台 teaching-research 生产 compose 对照示例
# 实际文件路径（与 xiaozhi-esp32-server 同级）：
#   ~/prjs/teaching-research/deploy/prod/docker-compose.yml
#
# 在 teaching-research 仓库中修改对应服务的 ports / networks，不要在本仓库执行 compose。
# HTTPS 由 xiaozhi 侧 deploy/prod/edge-nginx 占 443；
# teaching 的 Nginx 只绑定 127.0.0.1:8100，公网用 https://teach.newgravtech.com。

# ---------------------------------------------------------------------------
# 1. 在 teaching-research/deploy/prod/.env.prod（或 .env.example）增加：
# ---------------------------------------------------------------------------
# TEACHING_BIND=127.0.0.1
# TEACHING_PORT=8100

# ---------------------------------------------------------------------------
# 2. 找到对外提供 Web/Nginx 的服务（名称可能是 web / nginx / teaching-web），
#    将 ports 改为仅本机可访问，例如：
# -------------------------------------------------------------------
#    ports:
#      - "${TEACHING_BIND:-127.0.0.1}:${TEACHING_PORT:-8100}:80"
#    若容器内 Nginx 监听 8080，则右侧改为 8080，例如 :8080 而非 :80
#
# ---------------------------------------------------------------------------
# 3. 接入与小智相同的 Docker 网络（便于 internal API；若 teaching 已配置可跳过）：
# -------------------------------------------------------------------
#    networks:
#      prod:
#        aliases:
#          - teaching-api   # 按 teaching 项目实际别名
#
# networks:
#   prod:
#     name: zhiban-prod
#     external: true
#
# ---------------------------------------------------------------------------
# 4. 勿在 teaching compose 中映射 443；证书与 teach.newgravtech.com 在
#    xiaozhi-esp32-server/deploy/prod/edge-nginx/nginx.conf 中配置。
# ---------------------------------------------------------------------------
