# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

# 公网部署务必关闭 OpenAPI（prod 配置或 XIAOZHI_OPENAPI_ENABLED=false）
# 家长端：上传头像返回的 avatarUrl 依赖 parent.public-base-url（需与小程序/浏览器实际访问地址一致，含 context-path /xiaozhi）
# 不填则从请求推断。Docker 仅映射 8002、公网用 IP 访问时易缺端口，建议填例如：http://47.84.15.224:8002/xiaozhi
xiaozhi:
  openapi:
    enabled: ${XIAOZHI_OPENAPI_ENABLED:false}
  parent:
    public-base-url:

springdoc:
  api-docs:
    enabled: ${xiaozhi.openapi.enabled:false}
  swagger-ui:
    enabled: ${xiaozhi.openapi.enabled:false}

knife4j:
  enable: ${xiaozhi.openapi.enabled:false}
  production: ${KNIFE4J_PRODUCTION:true}
  basic:
    enable: ${KNIFE4J_BASIC_ENABLE:false}
    username: ${KNIFE4J_BASIC_USERNAME:doc}
    password: ${KNIFE4J_BASIC_PASSWORD:}
  setting:
    enableFooter: false

teaching:
  internal-api-key: ${TEACHING_INTERNAL_API_KEY:dev-teaching-internal-change-me}

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE