user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1024m;

    server {
        listen 80;
        server_name console.newgravtech.com api.newgravtech.com teach.newgravtech.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name console.newgravtech.com;
        ssl_certificate     /etc/nginx/ssl/console.newgravtech.com.pem;
        ssl_certificate_key /etc/nginx/ssl/console.newgravtech.com.key;

        location / {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 443 ssl;
        server_name api.newgravtech.com;
        ssl_certificate     /etc/nginx/ssl/api.newgravtech.com.pem;
        ssl_certificate_key /etc/nginx/ssl/api.newgravtech.com.key;

        location /xiaozhi/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { return 404; }
    }

    server {
        listen 443 ssl;
        server_name teach.newgravtech.com;
        ssl_certificate     /etc/nginx/ssl/teach.newgravtech.com.pem;
        ssl_certificate_key /etc/nginx/ssl/teach.newgravtech.com.key;

        location / {
            proxy_pass http://127.0.0.1:8100;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
