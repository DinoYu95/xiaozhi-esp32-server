# 宿主机 edge：独占 80/443，反代小智 web(8002) 与 teaching(8100)
# 证书目录：/etc/nginx/ssl（console/api/teach 的 pem/key）
# 启动：cd deploy/prod/edge-nginx && docker compose up -d
# 须在小智 web、teaching 已启动且 127.0.0.1:8002/8100 可访问后再启 edge

services:
  edge:
    image: nginx:1.25-alpine
    container_name: edge-nginx
    restart: always
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
