# 阿里云单机部署：manager-api + manager-web + xiaozhi-server + MySQL + Redis
# 使用前：cp .env.example .env 并修改 .env 中的密码等配置
# 启动：docker compose up -d
#
# 首次部署希望与本地 MySQL 一致：在本地导出后把 SQL 放到 init-db/ 目录，
# 再在远程第一次执行 up（仅当 MySQL 数据目录为空时才会执行 init-db 里的脚本）。

version: '3.8'

services:
  # 数据库（manager-api 使用；暴露 3306 供同机 voiceprint-api 等通过 host.docker.internal 连接）
  db:
    image: mysql:8.0
    container_name: xiaozhi-mysql
    restart: always
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaozhi_esp32_server}
      MYSQL_INITDB_ARGS: "--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 45s
      interval: 10s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - xiaozhi

  # Redis（manager-api、xiaozhi-server 共用；暴露端口供同机 zhiban-agent 等复用）
  redis:
    image: redis:7-alpine
    container_name: xiaozhi-redis
    restart: always
    env_file: .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - xiaozhi

  # 智控台（manager-api + manager-web，Nginx 反代 Java）
  # 镜像：未设 WEB_IMAGE 时用本地构建 xiaozhi-esp32-server:web_latest（docker compose up -d --build）
  web:
    build:
      context: ..
      dockerfile: Dockerfile-web
    image: ${WEB_IMAGE:-xiaozhi-esp32-server:web_latest}
    container_name: xiaozhi-web
    restart: always
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      # 家长头像等外链（含 /xiaozhi）；HTTPS 或网关复杂时可设 https://域名/xiaozhi
      XIAOZHI_PARENT_PUBLIC_BASE_URL: ${XIAOZHI_PARENT_PUBLIC_BASE_URL:-}
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-xiaozhi_esp32_server}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      SPRING_DATASOURCE_DRUID_USERNAME: root
      SPRING_DATASOURCE_DRUID_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      XIAOZHI_OPENAPI_ENABLED: ${XIAOZHI_OPENAPI_ENABLED:-false}
    ports:
      - "${WEB_PORT:-8002}:8002"
    # 参数保存时 manager-api 会校验 server.voice_print（GET 该 URL）；Linux 需 host.docker.internal 才能访问宿主机上的声纹服务
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploadfile:/uploadfile
    networks:
      xiaozhi:
        aliases:
          - manager-api # 与文档中的 manager-api 主机名一致，便于 data/.config.yaml 写 http://manager-api:8002/xiaozhi

  # 小智服务端（Python，requirements 在镜像内安装）
  # 镜像：未设 SERVER_IMAGE 时用本地构建（Dockerfile-server-standalone）docker compose up -d --build
  server:
    build:
      context: ..
      dockerfile: Dockerfile-server-standalone
    image: ${SERVER_IMAGE:-xiaozhi-esp32-server:server_latest}
    container_name: xiaozhi-server
    restart: always
    depends_on:
      - db
      - redis
      - web # 与 data/.config.yaml 中 manager-api.url（如 http://web:8002/xiaozhi）一致，先起智控台再拉配置
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    # 127.0.0.11：解析 compose 服务名 web；再备公网/阿里云 DNS，避免仅内置转发失败时外网域名（如 TTS openspeech.bytedance.com）解析 -3
    dns:
      - 127.0.0.11
      - 223.5.5.5
      - 100.100.2.136
    ports:
      - "${SERVER_WS_PORT:-8000}:8000"
      - "${SERVER_HTTP_PORT:-8003}:8003"
    security_opt:
      - seccomp:unconfined
    # Linux 下容器内默认无 host.docker.internal，需显式映射到宿主机网关（用于 zhiban_agent.base_url 等）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      # 绑定「单个文件」时，若宿主机上该路径尚不存在，Docker 会创建同名「目录」，导致 wget 报 Is a directory。
      # 首次部署请先 mkdir -p models/SenseVoiceSmall && touch models/SenseVoiceSmall/model.pt 再 compose up，或先 down 再删掉错误目录后下载模型。
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
    networks:
      - xiaozhi

volumes:
  mysql_data:
  redis_data:

networks:
  xiaozhi:
    driver: bridge
